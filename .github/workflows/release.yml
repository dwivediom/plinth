# Bundling, as opposed to compiling.
#
# ci.yml proves the app *compiles* on all three platforms on every push, which
# is the cheap question and the one worth asking often. This asks the expensive
# one — does it package, install and launch — and it asks it on a tag, because
# that is the only moment the answer matters.
#
# The Windows installer is the reason this exists at all: Tauri cannot
# cross-compile to Windows from macOS, so an .exe can only come off a Windows
# runner. The same job makes the .dmg and the .deb/.AppImage on the way past.
name: Release

on:
  push:
    tags: ["v*"]
  # So a bundle can be produced without cutting a version.
  workflow_dispatch:

jobs:
  bundle:
    name: Bundle for ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg for Intel and Apple Silicon, rather than two downloads and
          # a question the person has to answer before they can try the app.
          - os: macos-latest
            label: macOS (universal)
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            label: Linux
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      # 22.04 rather than latest: the AppImage is only portable back to the
      # glibc it was linked against, so the oldest runner is the right one.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libssl-dev

      - run: npm ci

      # Only *set* the signing variables when there is something to set.
      # `${{ secrets.X || '' }}` in an env block still defines the variable,
      # and Tauri tests whether APPLE_CERTIFICATE exists rather than whether
      # it has content — so an empty one is not "unsigned", it is `security
      # import` being handed nothing and the whole macOS bundle failing.
      - name: macOS signing credentials
        if: matrix.os == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No Developer ID certificate configured — the .dmg will be ad-hoc signed."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          # Notarisation is what actually silences Gatekeeper; signing alone
          # does not. Both or neither, so a half-configured repository does
          # not ship a signed build that still says the app is damaged.
          if [ -n "$A_ID" ] && [ -n "$A_PASSWORD" ] && [ -n "$A_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$A_ID"
              echo "APPLE_PASSWORD=$A_PASSWORD"
              echo "APPLE_TEAM_ID=$A_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Signing and notarising."
          else
            echo "Signing, but NOT notarising — Gatekeeper will still warn."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Draft, so the release is read before anyone can download it — and
          # so a run that fails on one platform does not publish a release that
          # silently has no Windows build in it.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.sha) }}
          releaseName: Plinth ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}
          releaseBody: |
            The Windows build is not signed: SmartScreen will warn once, and
            the way past it is More info → Run anyway.

            If the macOS signing secrets are not configured, the .dmg is not
            signed either and macOS will call the app damaged. It is not —
            right-click the app and choose Open.
          args: ${{ matrix.args }}
